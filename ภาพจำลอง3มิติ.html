<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แบบจำลอง 3 มิติ จุดติดตั้งกล้องวงจรปิด</title>
<style>
:root{--bg:#dfe9ef;--panel:#fbfcfdee;--fg:#18202b;--mut:#5d6b7c;--bd:#cdd6df;--hi:#e8eef4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#171d29ee;--fg:#edf1f6;--mut:#9aa8b8;--bd:#2b3546;--hi:#243044}}
:root[data-theme="dark"]{--panel:#171d29ee;--fg:#edf1f6;--mut:#9aa8b8;--bd:#2b3546;--hi:#243044}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;overflow:hidden}
#app{position:relative;height:100%}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#panel{position:absolute;left:12px;top:12px;width:272px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:14px;backdrop-filter:blur(8px)}
h1{font-size:17px;margin:0 0 2px;font-weight:700}
.sub{font-size:12.5px;color:var(--mut);margin:0 0 12px;line-height:1.5}
.cam{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--bd);color:inherit;font:inherit;padding:9px 6px;cursor:pointer;border-radius:0}
.cam:hover,.cam.on{background:var(--hi)}
.cam:focus-visible,.btn:focus-visible{outline:2px solid #2f7de1;outline-offset:1px}
.dot{flex:none;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.cam b{display:block;font-size:14px}
.cam span{font-size:12px;color:var(--mut)}
.opts{border-top:1px solid var(--bd);padding-top:10px;margin-top:2px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.opts label{display:flex;gap:8px;align-items:center;cursor:pointer}
.row{display:flex;gap:8px}
.btn{flex:1;font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--bd);background:var(--hi);color:var(--fg);border-radius:8px;cursor:pointer}
.tag{position:absolute;left:0;top:0;width:26px;height:26px;margin:-34px 0 0 -13px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px #0005;cursor:pointer;will-change:transform}
.tag.on{outline:3px solid #fff8}
#hint{position:absolute;right:12px;bottom:12px;font-size:12px;color:var(--mut);background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
@media (max-width:640px){
 #panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:42%}
 #hint{display:none}
}
</style>
</head>
<body>
<div id="app">
 <canvas id="c" aria-label="แบบจำลอง 3 มิติของบ้านและจุดติดตั้งกล้องวงจรปิด"></canvas>
 <div id="tags"></div>
 <div id="panel">
  <h1>จุดติดตั้งกล้องวงจรปิด</h1>
  <p class="sub">บ้านสองชั้นพร้อมรั้ว กดหมายเลขเพื่อดูจุดติดตั้งและมุมมองของกล้องแต่ละตัว</p>
  <div id="list"></div>
  <div class="opts">
   <label><input type="checkbox" id="fov" checked> แสดงขอบเขตการมองเห็น</label>
   <label><input type="checkbox" id="auto"> หมุนอัตโนมัติ</label>
   <div class="row"><button class="btn" id="reset">มุมเริ่มต้น</button><button class="btn" id="top">มุมบน</button></div>
  </div>
 </div>
 <div id="hint">ลากเพื่อหมุน 360° · เลื่อนล้อเมาส์หรือบีบนิ้วเพื่อซูม</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const COL=['#e5484d','#2f7de1','#f0a020','#2fa66a','#8e5ad7','#e0589b'];
const CAMS=[
 {n:'ประตูหน้าบ้าน',d:'คลุมทางเข้าหลักและหน้าประตู',p:[0,4.7,4.15],t:[0,0,11]},
 {n:'มุมซ้ายหน้าบ้าน',d:'ดูแนวรั้วและสนามด้านซ้าย',p:[-5.1,5.2,4.1],t:[-10,0,10]},
 {n:'ที่จอดรถ',d:'คลุมรถและทางเข้าด้านขวา',p:[5.1,4.6,2],t:[7,0,8.5]},
 {n:'ประตูรั้ว',d:'ติดบนเสาหน้ารั้ว ดูผู้เข้า–ออก',p:[-2.5,4,12.2],t:[3,0,8],pole:1},
 {n:'ข้างบ้านด้านซ้าย',d:'คลุมทางเดินข้างบ้าน',p:[-5.1,4.6,-1],t:[-9,0,-1]},
 {n:'หลังบ้าน',d:'คลุมประตูหลังและแนวรั้วด้านหลัง',p:[0,4.7,-4.15],t:[0,0,-11]}
];
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;
const S=new THREE.Scene();
S.background=new THREE.Color(0xcfe3f1);
S.fog=new THREE.Fog(0xcfe3f1,70,130);
const cam=new THREE.PerspectiveCamera(50,1,0.1,300);
S.add(new THREE.HemisphereLight(0xffffff,0x6b8a5a,0.75));
const sun=new THREE.DirectionalLight(0xfff3dc,0.9);
sun.position.set(18,30,14);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-24,right:24,top:24,bottom:-24,near:1,far:90});
S.add(sun);

function box(w,h,d,x,y,z,c,o){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial(Object.assign({color:c},o||{})));
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;S.add(m);return m;
}
// ground
const g=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshLambertMaterial({color:0x9cc58a}));
g.rotation.x=-Math.PI/2;g.receiveShadow=true;S.add(g);
box(27,0.04,26,0,0.02,-0.25,0x86b575);              // lawn
box(4,0.06,13,6.5,0.04,6,0x9aa0a8);                  // driveway
box(1.6,0.06,8,0,0.04,8,0xd8d2c4);                   // walkway
// house
box(10,6,8,0,3,0,0xf1ece0);
box(10.2,0.25,8.2,0,3,0,0xd9d2c1);
const roof=new THREE.Mesh(new THREE.ConeGeometry(7,2.8,4),new THREE.MeshLambertMaterial({color:0x8a4b3a}));
roof.rotation.y=Math.PI/4;roof.scale.set(11.4/9.9,1,9.4/9.9);roof.position.y=7.4;roof.castShadow=true;S.add(roof);
box(1.4,2.6,0.12,0,1.3,4.04,0x6b4630);
[-3.2,3.2].forEach(x=>{box(1.7,1.4,0.1,x,1.9,4.04,0x9ccfe8);box(1.7,1.4,0.1,x,4.5,4.04,0x9ccfe8);box(1.7,1.4,0.1,x,4.5,-4.04,0x9ccfe8)});
box(1.4,2.6,0.12,0,1.3,-4.04,0x6b4630);
[-1,1].forEach(z=>{box(0.1,1.4,1.5,-5.04,1.9,z*2,0x9ccfe8);box(0.1,1.4,1.5,5.04,4.5,z*2,0x9ccfe8)});
// fence
const FC=0xe9e4d8,FH=1.8;
function fx(a,b,z){box(b-a,FH,0.2,(a+b)/2,FH/2,z,FC)}
function fz(a,b,x){box(0.2,FH,b-a,x,FH/2,(a+b)/2,FC)}
fx(-13,-0.8,12.5);fx(0.8,4.5,12.5);fx(8.5,13,12.5);fx(-13,13,-13);fz(-13,12.5,-13);fz(-13,12.5,13);
box(4,1.6,0.12,6.5,0.9,12.5,0x444b55);              // gate
box(0.3,2.2,0.3,-0.8,1.1,12.5,0xcfc8b8);box(0.3,2.2,0.3,0.8,1.1,12.5,0xcfc8b8);
// car
box(2,0.8,4.2,6.5,0.6,6,0x3b5b92);box(1.8,0.7,2.3,6.5,1.3,6.2,0x9ccfe8);
// trees & bushes
function tree(x,z,s){box(0.4*s,2.2*s,0.4*s,x,1.1*s,z,0x7a5539);
 const f=new THREE.Mesh(new THREE.SphereGeometry(1.7*s,16,12),new THREE.MeshLambertMaterial({color:0x4f9a4a}));
 f.position.set(x,3.2*s,z);f.castShadow=true;S.add(f)}
tree(-9,6,1);tree(-10,-8,1.2);tree(10,-8,1);tree(9,-3,0.8);
[-4,4].forEach(x=>{const b=new THREE.Mesh(new THREE.SphereGeometry(0.7,12,8),new THREE.MeshLambertMaterial({color:0x3f8a46}));b.position.set(x,0.5,4.9);b.castShadow=true;S.add(b)});

// cameras
const fovs=[],tags=[],listEl=document.getElementById('list'),tagsEl=document.getElementById('tags');
CAMS.forEach((c,i)=>{
 const col=new THREE.Color(COL[i]),p=V(...c.p),t=V(...c.t);
 const grp=new THREE.Group();grp.position.copy(p);
 const mat=new THREE.MeshLambertMaterial({color:0xf5f5f5});
 const body=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.17,0.6,16).rotateX(Math.PI/2),mat);body.position.z=0.3;
 const lens=new THREE.Mesh(new THREE.SphereGeometry(0.12,12,8),new THREE.MeshBasicMaterial({color:0x111418}));lens.position.z=0.62;
 const led=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,6),new THREE.MeshBasicMaterial({color:0xff2d2d}));led.position.set(0,0.18,0.5);
 const br=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.4),new THREE.MeshLambertMaterial({color:0x777777}));br.position.z=-0.1;
 grp.add(body,lens,led,br);grp.lookAt(t);S.add(grp);
 if(c.pole){const pl=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,p.y,8),new THREE.MeshLambertMaterial({color:0x666b73}));pl.position.set(p.x,p.y/2,p.z-0.35);pl.castShadow=true;S.add(pl)}
 const dir=t.clone().sub(p),L=dir.length();
 const cg=new THREE.ConeGeometry(L*0.45,L,32,1,true);cg.translate(0,-L/2,0);
 const cone=new THREE.Mesh(cg,new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.2,side:THREE.DoubleSide,depthWrite:false}));
 cone.position.copy(p);cone.quaternion.setFromUnitVectors(V(0,-1,0),dir.normalize());S.add(cone);fovs.push(cone);
 const tg=document.createElement('div');tg.className='tag';tg.textContent=i+1;tg.style.background=COL[i];
 tg.onclick=()=>fly(i);tagsEl.appendChild(tg);tags.push({el:tg,p:p.clone().add(V(0,0.5,0))});
 const b=document.createElement('button');b.className='cam';
 b.innerHTML='<i class="dot" style="background:'+COL[i]+'">'+(i+1)+'</i><div><b>'+c.n+'</b><span>'+c.d+'</span></div>';
 b.onclick=()=>fly(i);listEl.appendChild(b);c.btn=b;c.dir=dir.clone();
});

// orbit controls
const home={th:0.65,ph:1.08,r:40,t:V(0,2,1)};
const st={th:home.th,ph:home.ph,r:home.r,t:home.t.clone()};
let goal=null,sel=-1;
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
function fly(i){
 sel=i;CAMS.forEach((c,k)=>{c.btn.classList.toggle('on',k===i);tags[k].el.classList.toggle('on',k===i)});
 const c=CAMS[i],d=c.dir;
 goal={th:st.th+wrap(Math.atan2(-d.x,-d.z)-st.th),ph:1.25,r:13,t:V(...c.p).add(d.clone().multiplyScalar(0.25))};
}
function setGoal(o){goal=Object.assign({t:st.t.clone(),th:st.th,ph:st.ph,r:st.r},o);sel=-1;
 CAMS.forEach((c,k)=>{c.btn.classList.remove('on');tags[k].el.classList.remove('on')})}
document.getElementById('reset').onclick=()=>setGoal({th:home.th,ph:home.ph,r:home.r,t:home.t.clone()});
document.getElementById('top').onclick=()=>setGoal({ph:0.2,r:46,t:V(0,0,0)});
document.getElementById('fov').onchange=e=>fovs.forEach(f=>f.visible=e.target.checked);
const autoEl=document.getElementById('auto');

const ptr=new Map();let pinch=0;
const clampR=r=>Math.min(75,Math.max(5,r));
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});goal=null;pinch=0});
cv.addEventListener('pointerup',e=>ptr.delete(e.pointerId));
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{
 const o=ptr.get(e.pointerId);if(!o)return;
 const dx=e.clientX-o.x,dy=e.clientY-o.y;
 if(ptr.size===1){st.th-=dx*0.007;st.ph=Math.min(1.5,Math.max(0.12,st.ph-dy*0.006))}
 o.x=e.clientX;o.y=e.clientY;
 if(ptr.size===2){const [a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)st.r=clampR(st.r*pinch/d);pinch=d}
});
cv.addEventListener('wheel',e=>{e.preventDefault();goal=null;st.r=clampR(st.r*Math.exp(e.deltaY*0.001))},{passive:false});

function resize(){const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const pv=V(0,0,0);
function frame(){
 if(goal){const k=0.09;
  st.th+=(goal.th-st.th)*k;st.ph+=(goal.ph-st.ph)*k;st.r+=(goal.r-st.r)*k;st.t.lerp(goal.t,k);
  if(Math.abs(goal.th-st.th)+Math.abs(goal.r-st.r)<0.01)goal=null}
 else if(autoEl.checked&&!ptr.size)st.th+=0.0035;
 const sp=Math.sin(st.ph);
 cam.position.set(st.t.x+st.r*sp*Math.sin(st.th),st.t.y+st.r*Math.cos(st.ph),st.t.z+st.r*sp*Math.cos(st.th));
 cam.lookAt(st.t);
 const w=cv.clientWidth,h=cv.clientHeight;
 tags.forEach(o=>{pv.copy(o.p).project(cam);
  const vis=pv.z<1;o.el.style.display=vis?'':'none';
  o.el.style.transform='translate('+((pv.x+1)/2*w)+'px,'+((1-pv.y)/2*h)+'px)'});
 R.render(S,cam);requestAnimationFrame(frame);
}
frame();
})();
</script>
</body>
</html>
